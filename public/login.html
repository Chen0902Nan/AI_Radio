<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录网易云音乐</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app narrow">
      <h1>用网易云音乐 App 扫码登录</h1>
      <p class="hint">
        二维码只在本机使用。登录 cookie 保存在项目的 <code>data/session.json</code>，不会发送到任何第三方，
        页面也不会拿到它。本应用只读取资料与播放地址，不会修改你的红心或歌单。
      </p>
      <div class="qr"><img id="qr" alt="登录二维码" /></div>
      <div class="status" id="status">正在获取二维码…</div>
      <button id="refresh" class="ghost">二维码过期了？点这里换一张</button>
      <a class="back" href="/">← 返回播放器</a>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
