<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>个人电台 · 第一阶段验证</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <h1>个人电台<span class="tag">音乐链路验证</span></h1>
        <div id="account" class="account">连接中…</div>
      </header>

      <section class="player">
        <div class="now">
          <div class="art" id="art">♪</div>
          <div class="meta">
            <div class="title" id="title">未在播放</div>
            <div class="artist" id="artist">—</div>
            <div class="album" id="album"></div>
          </div>
        </div>

        <div class="progress">
          <span id="elapsed">0:00</span>
          <div class="bar"><div class="fill" id="fill"></div></div>
          <span id="duration">0:00</span>
        </div>

        <div class="controls">
          <button id="play" class="primary" disabled>开播</button>
          <button id="next" disabled>下一首</button>
          <button id="stop" disabled>停止</button>
          <span class="counter" id="counter"></span>
        </div>

        <div class="controls secondary">
          <span class="hint">对这首歌：</span>
          <button id="like">喜欢</button>
          <button id="dislike">不喜欢</button>
          <button id="unlike" class="ghost">撤销反馈</button>
          <span class="session" id="session">未开播</span>
        </div>

        <div class="status" id="status">先登录并读取资料，然后点击开播。</div>
        <div class="status prep" id="prepStatus">后台补歌：待播不足时会自动准备下一批，不打断当前歌曲。</div>
      </section>

      <section class="codex">
        <div class="lib-head">
          <h2>Codex 选歌</h2>
          <button id="clearPlan" class="ghost">清除 Codex 队列</button>
        </div>
        <div class="codex-row">
          <input id="brief" placeholder="想听什么场景？例如：深夜安静、适合一个人听" />
          <button id="plan" class="primary">让 Codex 选歌</button>
        </div>
        <div class="status" id="codexStatus">
          用本机 Codex 订阅，从你的红心歌曲里挑一批歌，接在当前播放之后。
        </div>
        <div id="codexPicks" class="picks"></div>
      </section>

      <section class="dj">
        <div class="lib-head">
          <h2>DJ 串场</h2>
          <span class="dj-controls">
            <label class="dj-toggle"><input type="checkbox" id="djEnabled" /> 开启 DJ</label>
            <label class="dj-interval">每
              <select id="djInterval">
                <option value="3">3</option>
                <option value="4" selected>4</option>
                <option value="5">5</option>
              </select>
              首一次
            </label>
          </span>
        </div>
        <div class="status prep" id="djStatus">DJ 串场：歌曲之间用有出处的资料介绍下一首，语音不可用时继续纯音乐。</div>
        <div id="segueInfo" class="segue-info" hidden>
          <div class="segue-head">DJ 串场 · 接下来：<span id="segueTarget"></span></div>
          <div class="segue-script" id="segueScript"></div>
          <div class="segue-sources" id="segueSources"></div>
        </div>
        <div class="dj-preview">
          <input id="previewVoice" placeholder="音色 reference_id（试听用，选定后保存为正式音色）" />
          <button id="previewSave" class="ghost" disabled>设为正式音色</button>
          <button id="previewBtn" class="ghost">试听</button>
        </div>
      </section>

      <section class="library">
        <div class="lib-head">
          <h2>音乐资料</h2>
          <button id="reload" class="ghost">重新读取</button>
        </div>
        <div class="lib-body">
          <aside class="lists">
            <button class="list-item active" data-kind="liked" id="likedItem">
              <span class="li-name">红心歌曲</span><span class="li-count" id="likedCount">—</span>
            </button>
            <div id="playlists" class="playlists"></div>
          </aside>
          <div class="tracks" id="tracks"></div>
        </div>
      </section>

      <audio id="audio" preload="none"></audio>
    </main>
    <script src="/program-contract.js"></script>
    <script src="/segue-controller.js"></script>
    <script src="/orchestrator.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
